<!DOCTYPE html>
<!-- data-theme="light" ON THE MARKUP: the theme's dark palette applies under
     `prefers-color-scheme: dark` to any <html> WITHOUT this attribute, so a
     dark OS rendered the admin dark before any script ran (owner, 2026-09-25:
     the admin is light). Nothing in the admin removes it. -->
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/growcord-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The Growcord type (ADMIN-BRAND-1): Inter for text, as growcord.in, and Plus Jakarta Sans for headings and
         figures, the same link the platform console loads (gcsu/index.html). Without it "Inter" in the theme fell
         back to each computer's own font. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="/scanner-icon.svg" />
    <title>Growcord Admin Dashboard</title>
    <!-- No Tailwind Play CDN here. It never reads tailwind.config.js, so it
         served a SECOND, un-themed palette beside the compiled stylesheet and
         made the universal theme (docs/UI_THEME.md) non-authoritative. The
         compiled CSS carries every class this app uses. -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <!-- Shown until the app paints: the Growcord wordmark and an orange ring on the theme's warm ground
           (literal values, because the stylesheet is not loaded yet). -->
      <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui; background-color: #faf9f7;">
        <div style="text-align: center;">
          <img src="/brand/growcord-logo.png" alt="Growcord" width="150" height="30" style="display: block; margin: 0 auto 22px;" />
          <div style="border: 3px solid #e7e4df; border-top-color: #ea580c; border-radius: 50%; width: 32px; height: 32px; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
          <p style="color: #5d5852; font-size: 14px; font-weight: 500;">Loading admin panel...</p>
          <p style="color: #a49f97; font-size: 12px; margin-top: 8px;">If this takes too long, check the browser console for errors.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </body>
</html>
