# Static single-page app: every path that is not a file falls back to index.html; assets are
# immutable (Vite hashes them); the API lives on its own host (VITE_API_BASE), nothing is proxied.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  # The hosted sign-in bundle (UI-5): stable names, loaded cross-origin by the issuer's /signin page as <script type="module">
  # (a CORS-mode fetch), so it needs ACAO *. Revalidated, not immutable: the names do not change per release.
  location /hosted/ { add_header Access-Control-Allow-Origin "*" always; add_header Cache-Control "public, max-age=86400, must-revalidate" always; add_header X-Content-Type-Options nosniff always; try_files $uri =404; }
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
